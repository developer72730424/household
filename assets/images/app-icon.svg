<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon for "household" app
  - 1024x1024 viewBox vector SVG
  - Rounded square gradient background
  - House silhouette + coin with ¥ (yen) to suggest household finance
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Household - アイコン</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#20C997"/>
      <stop offset="100%" stop-color="#2D8CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dy="8" result="off"/>
      <feGaussianBlur in="off" stdDeviation="12" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="960" height="960" rx="200" ry="200" fill="url(#g)" />

  <!-- subtle inner white glow -->
  <rect x="32" y="32" width="960" height="960" rx="200" ry="200" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="64"/>

  <!-- House silhouette -->
  <g transform="translate(150,200) scale(0.7)">
    <path d="M384 128L64 320v288c0 35.3 28.7 64 64 64h128V448h192v224h128c35.3 0 64-28.7 64-64V320L384 128z" fill="#FFFFFF"/>
    <!-- Door -->
    <rect x="240" y="384" width="96" height="160" rx="12" fill="#E6F0FF"/>
    <!-- Window left -->
    <rect x="120" y="256" width="96" height="80" rx="8" fill="#E6F0FF"/>
    <!-- Window right -->
    <rect x="320" y="256" width="96" height="80" rx="8" fill="#E6F0FF"/>
  </g>

  <!-- Coin with yen symbol (overlay, slightly to the right-bottom) -->
  <g transform="translate(620,540)">
    <circle cx="0" cy="0" r="140" fill="#FFD166" stroke="#F4B400" stroke-width="8"/>
    <circle cx="0" cy="0" r="120" fill="rgba(255,255,255,0.08)"/>
    <text x="0" y="18" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="120" fill="#3A2E2E" font-weight="700" text-anchor="middle">¥</text>
  </g>

</svg>
